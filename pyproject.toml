[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suryabench"
version = "0.1.0"
description = "Measuring Verifier Independence in Agentic Regulatory Reasoning over Indian Rooftop-Solar Rules"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "SuryaBench Team" },
]
dependencies = [
    "pydantic>=2.7.0",
    "typing-extensions>=4.10.0",
    "pypdf>=5.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# corpus extraction and translation (src/suryabench/corpus/); needed to re-extract and for mypy
corpus = [
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "rapidocr-onnxruntime>=1.3.0",
    "langdetect>=1.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["30_code/src/suryabench"]

[tool.ruff]
line-length = 100
target-version = "py311"
# First-party code lives under 30_code/ (layout since 2026-09-29), so import sorting treats
# `suryabench` as first-party exactly as it did when the package sat in src/.
src = ["30_code/src", "30_code/tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["30_code/tests"]
pythonpath = ["30_code/src"]
filterwarnings = [
    "error",
]
